name: Live Cloudflare AI smoke test

on:
  push:
    branches: [main]
    paths:
      - "worker/src/index.js"
      - "scripts/live-ai-smoke.mjs"
      - ".github/workflows/live-ai-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test deployed Qwen model and 5-question generation (consumes free quota)
        run: node scripts/live-ai-smoke.mjs
