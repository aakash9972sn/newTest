name: Hosted Gemini health check

on:
  push:
    branches: [main]
    paths:
      - "hosted-ai.js"
      - "scripts/live-ai-smoke.mjs"
      - ".github/workflows/live-ai-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/live-ai-smoke.mjs"
      - ".github/workflows/live-ai-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check hosted backend health
        run: node scripts/live-ai-smoke.mjs
